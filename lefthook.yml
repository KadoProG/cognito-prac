pre-commit:
  parallel: true
  commands:
    typecheck:
      run: pnpm typecheck
    lint:
      run: pnpm lint

pre-push:
  commands:
    test:
      run: pnpm test

post-merge:
  commands:
    install:
      files: git diff ORIG_HEAD HEAD --name-only
      glob: "pnpm-lock.yaml"
      run: pnpm install
