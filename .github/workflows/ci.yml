name: CI

on:
  pull_request:
  push:
    branches: [main]

# 同じブランチへ続けて push したときは、古い実行を打ち切る。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    env:
      # CI に git hooks は要らない。lefthook は手元のコミット時のためのもの。
      LEFTHOOK: "0"

    steps:
      - uses: actions/checkout@v4

      # pnpm のバージョンは package.json の packageManager から解決される。
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      # lockfile が古いまま push されたらここで落とす。
      - run: pnpm install --frozen-lockfile

      # 手元の lefthook と同じものを、飛ばせない場所で実行する。
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
