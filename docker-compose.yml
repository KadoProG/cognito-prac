services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Cognito のローカルエミュレータ。確認コードはメールではなく、このコンテナのログに出る
  # （docker compose logs -f cognito-local）。CODE を固定しておくと毎回 123456 で確認できる。
  cognito-local:
    image: jagregory/cognito-local:latest
    ports:
      - "9229:9229"
    environment:
      CODE: "123456"
    volumes:
      - ./.cognito:/app/.cognito
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://localhost:9229/health || exit 1",
        ]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
